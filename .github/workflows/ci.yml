name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: codefly-dev/core/.github/workflows/go-service-ci.yml@main
    with:
      # The Python runtime tests drive `uv` on the host (dependency sync,
      # pytest); it isn't on the runner by default.
      setup-run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

  # The runner lifecycle (Init / Start / Stop / Destroy) is concurrent gRPC
  # handlers sharing runnerMu, and its tests assert through the race detector:
  # a lost lock is a data race, not a failed assertion, so the shared workflow's
  # plain `go test` passes on code with the lock removed. This job is what makes
  # that regression visible; the shared workflow has no input to enable -race.
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          # Same reason as the shared workflow: setup-go's cache tar corrupts
          # the downloaded toolchain module on restore.
          cache: false
      - name: Setup
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Test (race detector)
        run: go test -race ./...
